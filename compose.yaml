name: week03-network

x-backend: &backend
  image: week03-backend:local
  build: ./backend
  expose:
    - "3000"
  networks:
    - private_subnet
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  load-balancer:
    image: nginx:1.30-alpine
    # Run our complete configuration directly; no image entrypoint rewrites.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "127.0.0.1:${LB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      - public_subnet
      - private_subnet
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend1:
    <<: *backend
    environment:
      INSTANCE_ID: Backend-1

  backend2:
    <<: *backend
    environment:
      INSTANCE_ID: Backend-2

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${PUBLIC_SUBNET:-172.28.10.0/24}
  private_subnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${PRIVATE_SUBNET:-172.28.20.0/24}

user nginx;
# A single worker makes this small teaching demo's sequential rotation easy to see.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    log_format routing escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"request":"$request","status":$status,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","request_time":"$request_time",'
        '"connection":"$connection","connection_requests":"$connection_requests"}';
    access_log /dev/stdout routing;

    # Docker's embedded DNS; no static container addresses.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream applications {
        zone applications 64k;
        # Equal weights use Nginx's default round-robin algorithm.
        # 'resolve' is available in open-source Nginx >= 1.27.3.
        server backend1:3000 resolve max_fails=1 fail_timeout=3s;
        server backend2:3000 resolve max_fails=1 fail_timeout=3s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        add_header X-Request-Id $request_id always;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 4s;
        proxy_buffering on;

        # Gateway liveness: does not consume a turn in the upstream pool.
        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","component":"load-balancer"}\n';
        }

        # Application readiness: proves at least one backend answers.
        location = /readyz { proxy_pass http://applications/healthz; }
        location = /api/whoami { proxy_pass http://applications; }
        location = /favicon.ico { access_log off; return 204; }
        location / { try_files $uri $uri/ =404; }
    }
}
